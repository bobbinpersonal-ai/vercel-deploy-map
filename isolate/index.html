  <script>
    (function () {
      var SELECTOR = [
        "#nl-badge-frame",
        "#nl-hud-frame",
        "#nl-badge",
        "#nl-mini",
        "#nl-pop",
        "#nl-card",
        "#nl-tools",
        "#nl-tip",
        "#nl-status",
        "netlify-hud",
        'iframe[title="Powered by Netlify"]',

      document.addEventListener("DOMContentLoaded", strip);

      var scheduled = false;

        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(function () {
          scheduled = false;
          strip();
        });
      });

      function start() {
        observer.observe(document.documentElement, { childList: true, subtree: true });
        setTimeout(strip, 1200);
        setTimeout(strip, 3500);

        // a short window to keep the observer off the React render path.
        setTimeout(function () {
          observer.disconnect();
        }, 20000);
      }

      if (document.documentElement) start();
      else document.addEventListener("DOMContentLoaded", start);
    })();
